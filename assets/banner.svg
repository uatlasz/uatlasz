<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <pattern id="seigaiha" width="56" height="28" patternUnits="userSpaceOnUse">
      <path d="M-14,28 A28,28 0 0,1 14,0 A28,28 0 0,1 42,28" fill="none" stroke="#ffffff" stroke-width="1"/>
      <path d="M14,28 A28,28 0 0,1 42,0 A28,28 0 0,1 70,28" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="1200" height="260" rx="24"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#roundedClip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect y="222" width="1200" height="38" fill="url(#seigaiha)" opacity="0.10"/>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="257" rx="22.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

  <!-- seal / hanko mark, top right -->
  <g transform="translate(1130,44)" opacity="0.85">
    <rect x="-22" y="-16" width="44" height="32" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="20" fill="#ffffff">刃</text>
  </g>

  <!-- vertical kanji accent, left edge -->
  <g font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="17" fill="#777777" text-anchor="middle" opacity="0.75">
    <text x="70" y="92">一</text>
    <text x="70" y="122">期</text>
    <text x="70" y="152">一</text>
    <text x="70" y="182">会</text>
  </g>
  <line x1="70" y1="46" x2="70" y2="72" stroke="#555555" stroke-width="1"/>
  <line x1="70" y1="196" x2="70" y2="222" stroke="#555555" stroke-width="1"/>

  <!-- title -->
  <text x="600" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="10" fill="#ffffff" filter="url(#glow)">UATLASZ</text>

  <!-- kanji subtitle -->
  <text x="600" y="185" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="24" letter-spacing="10" fill="#999999">見えざる刃、静かなる心</text>
</svg>
